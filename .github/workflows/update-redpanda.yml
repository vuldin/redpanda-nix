name: Update Redpanda Package

on:
  # Run weekly on Monday at 9 AM UTC
  schedule:
    - cron: '0 9 * * 1'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      version:
        description: 'Redpanda version to update to (leave empty for latest)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.check.outputs.has_update }}
      new_version: ${{ steps.check.outputs.new_version }}
      current_version: ${{ steps.check.outputs.current_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check for updates
        id: check
        run: |
          # Get current version from deb.nix
          CURRENT_VERSION=$(grep 'version = ' deb.nix | head -1 | cut -d'"' -f2)
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"

          # Get latest version from GitHub (or use manual input)
          if [ -n "${{ inputs.version }}" ]; then
            NEW_VERSION="${{ inputs.version }}"
            echo "Using manual version: $NEW_VERSION"
          else
            NEW_VERSION=$(curl -s https://api.github.com/repos/redpanda-data/redpanda/releases/latest | \
              grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
            echo "Latest version from GitHub: $NEW_VERSION"
          fi

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

          # Compare versions
          if [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            echo "has_update=true" >> $GITHUB_OUTPUT
            echo "✅ Update available: $CURRENT_VERSION → $NEW_VERSION"
          else
            echo "has_update=false" >> $GITHUB_OUTPUT
            echo "✅ Already at latest version: $CURRENT_VERSION"
          fi

  update-package:
    needs: check-update
    if: needs.check-update.outputs.has_update == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create update branch
        run: |
          BRANCH_NAME="update-redpanda-${{ needs.check-update.outputs.new_version }}"
          git checkout -b "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Run update script
        run: |
          chmod +x scripts/update.sh
          ./scripts/update.sh ${{ needs.check-update.outputs.new_version }}

      - name: Test build
        run: |
          echo "Testing deb package build..."
          nix build .#redpanda-deb --show-trace

      - name: Upload compliance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compliance-artifacts
          path: |
            compliance/redpanda-${{ needs.check-update.outputs.new_version }}-sbom.cdx.json
            compliance/redpanda-${{ needs.check-update.outputs.new_version }}-sbom.spdx.json
            compliance/redpanda-${{ needs.check-update.outputs.new_version }}-provenance.json
            compliance/redpanda-${{ needs.check-update.outputs.new_version }}-vulnerabilities.csv
          if-no-files-found: warn

      - name: Commit changes
        run: |
          git add deb.nix fips.nix flake.nix rpk.nix
          git commit -m "Update Redpanda to v${{ needs.check-update.outputs.new_version }}

          Automated update from ${{ needs.check-update.outputs.current_version }} to ${{ needs.check-update.outputs.new_version }}

          Generated by GitHub Actions
          Workflow: ${{ github.workflow }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Push changes
        run: |
          git push origin "$BRANCH_NAME"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --title "Update Redpanda to v${{ needs.check-update.outputs.new_version }}" \
            --body "## 🚀 Automated Redpanda Update

          **Current Version**: ${{ needs.check-update.outputs.current_version }}
          **New Version**: ${{ needs.check-update.outputs.new_version }}

          ### Changes

          This PR updates the Redpanda package to the latest release.

          #### Package Updates
          - ✅ Updated \`deb.nix\` with new version and SHA256 hashes
          - ✅ Updated \`flake.nix\` version reference
          - ✅ Successfully built deb package with \`nix build .#redpanda-deb\`

          #### Compliance Artifacts Generated
          - 📋 CycloneDX SBOM (JSON)
          - 📋 SPDX SBOM (JSON)
          - 🔒 SLSA v1.0 Provenance Attestation
          - 🔍 Vulnerability Scan (CVE detection)

          All artifacts available in \`compliance/redpanda-${{ needs.check-update.outputs.new_version }}-*\`

          ### Testing Checklist

          - [x] Package builds successfully (\`nix build\`)
          - [ ] Manual testing on NixOS (reviewer)
          - [ ] Compliance artifacts generated
          - [ ] No breaking changes in configuration

          ### Compliance Status

          Compliance status (see compliance/COMPLIANCE_MATRIX.md):
          - SOC 2 Type II (Strong)
          - FBI CJIS v6.0 (Strong)
          - NIST SP 800-161 (Strong)
          - ISO/IEC 27036 (Moderate)
          - FedRAMP High (Partial — organizational gaps)

          ---

          🤖 Generated by GitHub Actions
          📅 Triggered: ${{ github.event_name }}
          🔗 Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ### Release Notes

          See [Redpanda v${{ needs.check-update.outputs.new_version }} Release Notes](https://github.com/redpanda-data/redpanda/releases/tag/v${{ needs.check-update.outputs.new_version }}) for details." \
            --label "automated" \
            --label "update"

      - name: Check for critical vulnerabilities
        id: vuln_check
        run: |
          VULN_FILE="compliance/redpanda-${{ needs.check-update.outputs.new_version }}-vulnerabilities.csv"

          if [ -f "$VULN_FILE" ]; then
            CRITICAL=$(awk -F',' 'NR>1 && $2 == "CRITICAL"' "$VULN_FILE" | wc -l)
            HIGH=$(awk -F',' 'NR>1 && $2 == "HIGH"' "$VULN_FILE" | wc -l)
            MEDIUM=$(awk -F',' 'NR>1 && $2 == "MEDIUM"' "$VULN_FILE" | wc -l)

            echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
            echo "high=$HIGH" >> $GITHUB_OUTPUT
            echo "medium=$MEDIUM" >> $GITHUB_OUTPUT

            echo "Vulnerability Summary:"
            echo "  Critical: $CRITICAL"
            echo "  High: $HIGH"
            echo "  Medium: $MEDIUM"

            if [ "$CRITICAL" -gt 0 ]; then
              echo "⚠️  WARNING: Found $CRITICAL CRITICAL vulnerabilities!"
            fi
          else
            echo "No vulnerability scan file found"
            echo "critical=0" >> $GITHUB_OUTPUT
            echo "high=0" >> $GITHUB_OUTPUT
            echo "medium=0" >> $GITHUB_OUTPUT
          fi

      - name: Create vulnerability issue if critical found
        if: steps.vuln_check.outputs.critical > 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VULN_FILE="compliance/redpanda-${{ needs.check-update.outputs.new_version }}-vulnerabilities.csv"

          # Extract critical vulnerabilities
          CRITICAL_VULNS=$(awk -F',' 'NR>1 && $2 == "CRITICAL" {print "- **" $1 "**: " $3 " (CVSS: " $4 ")"}' "$VULN_FILE")

          gh issue create \
            --title "🚨 Critical Vulnerabilities in Redpanda v${{ needs.check-update.outputs.new_version }}" \
            --label "security,vulnerability,critical" \
            --body "## 🚨 Critical Security Vulnerabilities Detected

          **Package**: Redpanda v${{ needs.check-update.outputs.new_version }}
          **Scan Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Critical Count**: ${{ steps.vuln_check.outputs.critical }}
          **High Count**: ${{ steps.vuln_check.outputs.high }}

          ### Critical Vulnerabilities

          $CRITICAL_VULNS

          ### Action Required

          1. Review vulnerability details in \`compliance/redpanda-${{ needs.check-update.outputs.new_version }}-vulnerabilities.csv\`
          2. Check if upstream Redpanda has patches available
          3. If no patch available, assess risk and document mitigation
          4. Update POA&M (Plan of Action & Milestones)

          ### Compliance Impact

          - **DoD SBOM Management**: ✅ Automated vulnerability detection active
          - **NIST SP 800-161 SR-10**: ⚠️  Vulnerabilities detected, remediation required
          - **NIST CSF 2.0 GV.SC-10**: ✅ Supply chain risks monitored

          ### Related PR

          See PR for version update: https://github.com/${{ github.repository }}/pulls

          ---

          🤖 Auto-generated by vulnerability scanning workflow
          📅 Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Comment on PR with compliance details
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Wait a moment for PR to be created
          sleep 5

          PR_NUMBER=$(gh pr view "$BRANCH_NAME" --json number -q .number)

          # Build vulnerability summary
          VULN_SUMMARY=""
          if [ "${{ steps.vuln_check.outputs.critical }}" -gt 0 ]; then
            VULN_SUMMARY="### ⚠️ Vulnerability Alert

          **Critical**: ${{ steps.vuln_check.outputs.critical }}
          **High**: ${{ steps.vuln_check.outputs.high }}
          **Medium**: ${{ steps.vuln_check.outputs.medium }}

          ⚠️ **Critical vulnerabilities detected!** See automatically created issue for details.

          "
          else
            VULN_SUMMARY="### ✅ Vulnerability Scan

          **Critical**: 0
          **High**: ${{ steps.vuln_check.outputs.high }}
          **Medium**: ${{ steps.vuln_check.outputs.medium }}

          No critical vulnerabilities detected.

          "
          fi

          gh pr comment "$PR_NUMBER" --body "## 📊 Compliance Artifact Summary

          Generated compliance artifacts for Redpanda v${{ needs.check-update.outputs.new_version }}:

          ### SBOM Files
          \`\`\`
          compliance/redpanda-${{ needs.check-update.outputs.new_version }}-sbom.cdx.json (CycloneDX)
          compliance/redpanda-${{ needs.check-update.outputs.new_version }}-sbom.spdx.json (SPDX)
          \`\`\`

          ### Provenance
          \`\`\`
          compliance/redpanda-${{ needs.check-update.outputs.new_version }}-provenance.json (SLSA v1.0)
          \`\`\`

          ### Vulnerability Scan
          \`\`\`
          compliance/redpanda-${{ needs.check-update.outputs.new_version }}-vulnerabilities.csv
          \`\`\`

          $VULN_SUMMARY

          ### Verification Commands

          \`\`\`bash
          # Verify package integrity
          nix-store --verify --check-contents \$(nix-build)

          # View SBOM
          cat compliance/redpanda-${{ needs.check-update.outputs.new_version }}-sbom.cdx.json | jq

          # Check for vulnerabilities
          cat compliance/redpanda-${{ needs.check-update.outputs.new_version }}-vulnerabilities.csv
          \`\`\`

          ### Compliance Status

          These artifacts support:
          - DoD SBOM Management (Strong)
          - NIST SP 800-161 Supply Chain (Strong)
          - NIST CSF 2.0 GV.SC controls (Moderate)
          - Automated vulnerability alerting (this PR)"

  create-release:
    needs: [check-update, update-package]
    if: needs.check-update.outputs.has_update == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Download compliance artifacts
        uses: actions/download-artifact@v4
        with:
          name: compliance-artifacts
          path: artifacts/

      - name: Create GitHub Release with compliance artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-update.outputs.new_version }}
          name: Redpanda v${{ needs.check-update.outputs.new_version }}
          draft: true
          body: |
            ## Redpanda v${{ needs.check-update.outputs.new_version }}

            Automated package update from v${{ needs.check-update.outputs.current_version }}.

            ### Compliance Artifacts

            SBOM and provenance files are attached to this release for DoD SBOM Management and NIST SP 800-161 compliance.
            Verify with: `gh attestation verify`
          files: |
            artifacts/redpanda-${{ needs.check-update.outputs.new_version }}-sbom.cdx.json
            artifacts/redpanda-${{ needs.check-update.outputs.new_version }}-sbom.spdx.json
            artifacts/redpanda-${{ needs.check-update.outputs.new_version }}-provenance.json
            artifacts/redpanda-${{ needs.check-update.outputs.new_version }}-vulnerabilities.csv
          fail_on_unmatched_files: false

  notify-no-update:
    needs: check-update
    if: needs.check-update.outputs.has_update == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: No update needed
        run: |
          echo "✅ Package is already at latest version: ${{ needs.check-update.outputs.current_version }}"
          echo "No action required."
